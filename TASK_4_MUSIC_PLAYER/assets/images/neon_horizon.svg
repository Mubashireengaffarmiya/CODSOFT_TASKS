<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.8)"/>
      <stop offset="100%" stop-color="rgba(79, 172, 254, 0)"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Glowing Sun -->
  <circle cx="250" cy="220" r="110" fill="url(#sunGrad)" filter="drop-shadow(0 0 25px rgba(255, 0, 127, 0.6))"/>
  <!-- Sun stripes -->
  <rect x="130" y="195" width="240" height="6" fill="#24243e" rx="3"/>
  <rect x="140" y="215" width="220" height="10" fill="#24243e" rx="4"/>
  <rect x="155" y="240" width="190" height="14" fill="#24243e" rx="5"/>
  <rect x="175" y="270" width="150" height="18" fill="#24243e" rx="6"/>
  <!-- Mountains silhouette -->
  <polygon points="50,330 160,240 250,330" fill="#181534"/>
  <polygon points="200,330 320,210 440,330" fill="#14112c"/>
  <polygon points="120,330 220,260 300,330" fill="#221e42"/>
  <!-- Grid Horizon -->
  <rect x="0" y="330" width="500" height="170" fill="#0b091a"/>
  <line x1="0" y1="330" x2="500" y2="330" stroke="#00f2fe" stroke-width="2"/>
  <line x1="0" y1="355" x2="500" y2="355" stroke="url(#gridGrad)" stroke-width="1.5"/>
  <line x1="0" y1="385" x2="500" y2="385" stroke="url(#gridGrad)" stroke-width="1.5"/>
  <line x1="0" y1="425" x2="500" y2="425" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="0" y1="470" x2="500" y2="470" stroke="url(#gridGrad)" stroke-width="2.5"/>
  <!-- Perspective lines -->
  <line x1="250" y1="330" x2="250" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="160" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="70" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="-20" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="340" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="430" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="250" y1="330" x2="520" y2="500" stroke="url(#gridGrad)" stroke-width="2"/>
  <!-- Typography / Badge -->
  <text x="250" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="6">NEON HORIZON</text>
  <text x="250" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#00f2fe" letter-spacing="4">SYNTHWAVE DREAMS</text>
</svg>
