<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#cyberBg)"/>
  <!-- Glowing Circuit Lines -->
  <path d="M50,100 H180 L230,150 H380 L420,190 V320 L370,370 H150 L100,320 V150 Z" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="180" cy="100" r="5" fill="#00f2fe"/>
  <circle cx="380" cy="150" r="5" fill="#00f2fe"/>
  <circle cx="150" cy="370" r="5" fill="#00f2fe"/>
  
  <path d="M80,220 H160 L210,270 H340 L390,220 H450" fill="none" stroke="url(#neonPink)" stroke-width="2" opacity="0.5"/>
  <circle cx="160" cy="270" r="4" fill="#ff007f"/>
  <circle cx="340" cy="270" r="4" fill="#ff007f"/>
  
  <!-- Central Cyber Skull / Prism Logo -->
  <polygon points="250,140 330,220 250,340 170,220" fill="none" stroke="#00f2fe" stroke-width="3" filter="drop-shadow(0 0 12px #00f2fe)"/>
  <polygon points="250,170 300,225 250,305 200,225" fill="none" stroke="#ff007f" stroke-width="2" filter="drop-shadow(0 0 10px #ff007f)"/>
  <circle cx="250" cy="235" r="15" fill="#00f2fe" opacity="0.9"/>
  
  <!-- Binary / Hex Data Stream -->
  <text x="70" y="420" font-family="monospace" font-size="11" fill="#00f2fe" opacity="0.5">01000011 01011001 01000010 01000101 01010010</text>
  <text x="70" y="438" font-family="monospace" font-size="11" fill="#ff007f" opacity="0.5">0x7F 0x0A 0xDE 0xAD 0xBE 0xEF 0xC0 0xDE 0x99</text>

  <!-- Title -->
  <text x="250" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#ffffff" letter-spacing="5">CYBER PULSE</text>
  <text x="250" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#00f2fe" letter-spacing="3">NEO TOKYO 2077</text>
</svg>
